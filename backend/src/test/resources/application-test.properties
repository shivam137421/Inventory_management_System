# Test Profile Configuration (H2 in MySQL compatibility mode)
spring.datasource.url=jdbc:h2:mem:inventory_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway execution on in-memory test database
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Disable optional external config import during tests
spring.config.import=

# Email configuration for tests (ConsoleEmailService active)
resend.api-key=
mail.from=onboarding@resend.dev
app.frontend-base-url=http://localhost:4200

