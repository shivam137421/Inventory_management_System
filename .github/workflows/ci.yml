name: StockPilot CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  backend-build:
    name: Backend Build & Package (Spring Boot)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Package Backend
        working-directory: ./backend
        run: mvn -B clean package -DskipTests
        env:
          DB_URL: jdbc:mysql://localhost:3306/inventory
          DB_USERNAME: root
          DB_PASSWORD: ""

      - name: Verify Backend Artifact
        run: |
          ls -la backend/target/*.jar

  frontend-build:
    name: Frontend Build (Angular)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Angular Application
        working-directory: ./frontend
        run: npm run build

      - name: Verify Frontend Build Output
        run: |
          ls -la frontend/dist/frontend/browser

  secrets-and-security-check:
    name: Secrets & Repository Hygiene Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Scan Repository for Sensitive Files
        run: |
          echo "Scanning repository files for sensitive/secret files..."
          
          FORBIDDEN_FILES=$(find . -type f \( -name "*.env" -o -name ".env.*" -o -name "*.pem" -o -name "*.key" -o -name "*.secret" -o -name "application-local.properties" -o -name "*.jks" -o -name "*.p12" \) ! -path "*/node_modules/*" ! -path "*/.git/*")
          
          if [ -n "$FORBIDDEN_FILES" ]; then
            echo "ERROR: Found forbidden secret/environment file(s) tracked in repository:"
            echo "$FORBIDDEN_FILES"
            exit 1
          else
            echo "Repository hygiene check passed! No secret files detected."
          fi
